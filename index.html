<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#13151A">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Gym Tracker</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<style>
  :root {
    --bg: #13151A;
    --bg-elev: #1B1E26;
    --bg-elev-2: #21242E;
    --gold: #C9A227;
    --gold-dim: #8C7020;
    --green: #3A6B5C;
    --text: #ECECEC;
    --text-dim: #9AA0AC;
    --border: #2A2D36;
    --danger: #B4453D;
    --ok: #4C8C6E;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-tap-highlight-color: transparent;
    overscroll-behavior-y: none;
  }
  body {
    padding-bottom: calc(64px + env(safe-area-inset-bottom));
    min-height: 100vh;
  }
  h1, h2, h3, p { margin: 0; }
  button { font-family: inherit; }

  /* ---------- Header ---------- */
  header.app-header {
    position: sticky; top: 0; z-index: 10;
    background: var(--bg);
    padding: calc(14px + env(safe-area-inset-top)) 16px 12px;
    border-bottom: 1px solid var(--border);
  }
  header.app-header h1 {
    font-size: 17px;
    font-weight: 700;
    letter-spacing: 0.3px;
    color: var(--gold);
  }
  header.app-header .subtitle {
    font-size: 12px;
    color: var(--text-dim);
    margin-top: 2px;
  }

  /* ---------- Selector de sección (Gym / Comida) ---------- */
  .section-switch {
    display: flex; gap: 8px;
    padding: 12px 16px 0;
    max-width: 640px; margin: 0 auto;
  }
  .section-btn {
    flex: 1;
    padding: 10px;
    border-radius: 12px;
    background: var(--bg-elev);
    border: 1px solid var(--border);
    color: var(--text-dim);
    font-size: 13px;
    font-weight: 700;
    display: flex; align-items: center; justify-content: center; gap: 6px;
  }
  .section-btn .icon { font-size: 15px; }
  .section-btn.active {
    background: var(--gold);
    border-color: var(--gold);
    color: #13151A;
  }

  /* ---------- Views ---------- */
  .view { display: none; padding: 16px; max-width: 640px; margin: 0 auto; }
  .view.active { display: block; }

  /* ---------- Day selector chips ---------- */
  .day-chips {
    display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px;
  }
  .day-chip {
    flex: 0 0 auto;
    padding: 8px 14px;
    border-radius: 20px;
    background: var(--bg-elev);
    border: 1px solid var(--border);
    color: var(--text-dim);
    font-size: 13px;
    font-weight: 600;
  }
  .day-chip.active {
    background: var(--gold);
    border-color: var(--gold);
    color: #13151A;
  }

  /* ---------- Progress bar ---------- */
  .progress-wrap {
    margin-bottom: 18px;
  }
  .progress-label {
    display: flex; justify-content: space-between;
    font-size: 12px; color: var(--text-dim); margin-bottom: 6px;
  }
  .progress-track {
    height: 8px; border-radius: 4px; background: var(--bg-elev-2); overflow: hidden;
  }
  .progress-fill {
    height: 100%; background: linear-gradient(90deg, var(--green), var(--gold));
    border-radius: 4px; transition: width 0.3s ease;
  }

  /* ---------- Exercise card ---------- */
  .exercise-card {
    background: var(--bg-elev);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 14px;
    margin-bottom: 14px;
  }
  .exercise-title {
    font-size: 15px; font-weight: 700; color: var(--text);
    margin-bottom: 2px;
  }
  .exercise-meta {
    font-size: 12px; color: var(--gold); font-weight: 600;
    margin-bottom: 8px;
  }
  .exercise-note {
    font-size: 12px; color: var(--text-dim);
    line-height: 1.4;
    margin-bottom: 8px;
    padding: 8px 10px;
    background: var(--bg-elev-2);
    border-left: 3px solid var(--green);
    border-radius: 6px;
  }
  .exercise-last {
    font-size: 11.5px; color: var(--text-dim);
    margin-bottom: 10px;
  }
  .exercise-last strong { color: var(--gold); font-weight: 600; }

  .set-row {
    display: grid;
    grid-template-columns: 28px 1fr 1fr 40px;
    gap: 8px;
    align-items: center;
    margin-bottom: 8px;
  }
  .set-num {
    font-size: 12px; color: var(--text-dim); text-align: center;
  }
  .set-row input {
    width: 100%;
    background: var(--bg-elev-2);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 8px;
    padding: 9px 8px;
    font-size: 14px;
    text-align: center;
  }
  .set-row input:focus { outline: none; border-color: var(--gold); }
  .set-row input::placeholder { color: #565A66; }

  .check-btn {
    width: 40px; height: 40px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--bg-elev-2);
    color: var(--text-dim);
    font-size: 18px;
    display: flex; align-items: center; justify-content: center;
  }
  .check-btn.done {
    background: var(--ok);
    border-color: var(--ok);
    color: #fff;
  }

  .save-day-btn {
    width: 100%;
    padding: 15px;
    border-radius: 12px;
    border: none;
    background: var(--gold);
    color: #13151A;
    font-size: 15px;
    font-weight: 700;
    margin-top: 8px;
    margin-bottom: 8px;
  }
  .save-day-btn:active { opacity: 0.85; }

  .toast {
    position: fixed;
    bottom: calc(80px + env(safe-area-inset-bottom));
    left: 50%; transform: translateX(-50%);
    background: var(--ok);
    color: #fff;
    padding: 10px 18px;
    border-radius: 20px;
    font-size: 13px;
    font-weight: 600;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s ease, transform 0.25s ease;
    z-index: 100;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(-6px); }

  /* ---------- Week view ---------- */
  .week-card {
    background: var(--bg-elev);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 14px 16px;
    margin-bottom: 12px;
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
  }
  .week-card .info { flex: 1; }
  .week-card .day-name { font-size: 15px; font-weight: 700; }
  .week-card .day-focus { font-size: 12px; color: var(--text-dim); margin-top: 2px; }
  .week-ring { position: relative; width: 46px; height: 46px; flex: 0 0 auto; }
  .week-ring svg { transform: rotate(-90deg); }
  .week-ring .pct {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    font-size: 11px; font-weight: 700; color: var(--gold);
  }

  /* ---------- Tarjetas y formularios genéricos (usados por Alimentación) ---------- */
  .card {
    background: var(--bg-elev);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 16px;
    margin-bottom: 16px;
  }
  .card h2 { font-size: 14px; color: var(--gold); margin-bottom: 12px; font-weight: 700; }
  .form-field { display: flex; flex-direction: column; gap: 4px; }
  .form-field label { font-size: 11.5px; color: var(--text-dim); }
  .form-field input {
    width: 100%;
    background: var(--bg-elev-2);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 8px;
    padding: 10px;
    font-size: 14px;
  }
  .form-field input:focus { outline: none; border-color: var(--gold); }
  .date-range-grid {
    display: grid; grid-template-columns: 1fr 1fr; gap: 10px;
    margin-bottom: 12px;
  }
  .download-btn-inline {
    width: 100%;
    padding: 13px;
    border-radius: 10px;
    border: none;
    background: var(--green);
    color: #fff;
    font-weight: 700;
    font-size: 14px;
    display: flex; align-items: center; justify-content: center; gap: 6px;
  }

  /* ---------- Alimentación: formulario de captura rápida ---------- */
  .meal-form h2 { margin-bottom: 10px; }
  .meal-desc-input {
    width: 100%;
    background: var(--bg-elev-2);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 10px;
    padding: 10px 12px;
    font-size: 14px;
    font-family: inherit;
    resize: vertical;
    margin-bottom: 10px;
  }
  .meal-desc-input:focus { outline: none; border-color: var(--gold); }
  .meal-desc-input::placeholder { color: #565A66; }

  /* variante para el chip de snack_extra: aro dorado siempre visible,
     así resalta entre las 7 opciones para captura sin fricción */
  .day-chip.chip-accent {
    border-color: var(--gold);
    color: var(--gold);
  }
  .day-chip.chip-accent.active {
    background: var(--gold);
    color: #13151A;
  }

  /* ---------- Alimentación: tarjetas de registro (hoy / historial) ---------- */
  .meal-day-group {
    background: var(--bg-elev);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 14px;
    margin-bottom: 14px;
  }
  .meal-day-title {
    font-size: 14px; font-weight: 700; color: var(--text);
    margin-bottom: 8px;
  }
  .meal-day-title .count { color: var(--text-dim); font-weight: 500; font-size: 12px; }
  .meal-row {
    display: flex; gap: 10px; align-items: flex-start;
    padding: 10px 0;
    border-bottom: 1px solid var(--border);
  }
  .meal-row:last-child { border-bottom: none; }
  .meal-badge {
    flex-shrink: 0;
    background: var(--bg-elev-2);
    border: 1px solid var(--border);
    color: var(--gold);
    font-size: 10.5px;
    font-weight: 700;
    padding: 4px 8px;
    border-radius: 10px;
    white-space: nowrap;
    text-transform: uppercase;
    letter-spacing: 0.3px;
  }
  .meal-badge.snack { border-color: var(--gold); }
  .meal-desc-text {
    flex: 1;
    font-size: 13px; color: var(--text); line-height: 1.4;
    word-break: break-word;
    padding-top: 2px;
  }
  .meal-row-actions { display: flex; gap: 2px; flex-shrink: 0; }
  .meal-icon-btn {
    background: none; border: none;
    color: var(--text-dim);
    font-size: 15px;
    padding: 4px 6px;
  }
  .meal-icon-btn.danger { color: var(--danger); }
  .meal-empty { color: var(--text-dim); font-size: 13px; text-align: center; padding: 16px 0; }

  .meal-edit-row {
    display: flex; flex-direction: column; gap: 8px;
    padding: 10px 0;
    border-bottom: 1px solid var(--border);
  }
  .meal-edit-row:last-child { border-bottom: none; }
  .meal-edit-actions { display: flex; gap: 8px; }
  .meal-edit-actions button {
    flex: 1;
    padding: 9px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--bg-elev-2);
    color: var(--text);
    font-size: 13px;
    font-weight: 600;
  }
  .meal-edit-actions button.primary {
    background: var(--gold); border-color: var(--gold); color: #13151A;
  }

  /* ---------- Bottom nav ---------- */
  nav.tabbar {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 20;
    display: flex;
    background: var(--bg-elev);
    border-top: 1px solid var(--border);
    padding-bottom: env(safe-area-inset-bottom);
  }
  nav.tabbar button {
    flex: 1;
    background: none; border: none;
    color: var(--text-dim);
    font-size: 11.5px;
    font-weight: 600;
    padding: 10px 0 8px;
    display: flex; flex-direction: column; align-items: center; gap: 3px;
  }
  nav.tabbar button .icon { font-size: 19px; }
  nav.tabbar button.active { color: var(--gold); }
  nav.tabbar button.download-btn { color: var(--green); }

  /* ---------- Rest timer overlay ---------- */
  .timer-overlay {
    position: fixed; inset: 0; z-index: 200;
    background: rgba(10, 11, 14, 0.94);
    display: none;
    align-items: center; justify-content: center;
    flex-direction: column;
    gap: 22px;
    padding: 24px;
  }
  .timer-overlay.show { display: flex; }
  .timer-overlay .ex-name {
    color: var(--text-dim); font-size: 13px; text-align: center;
  }
  .timer-ring-wrap { position: relative; width: 220px; height: 220px; }
  .timer-ring-wrap svg { transform: rotate(-90deg); width: 100%; height: 100%; }
  .timer-ring-wrap .time-text {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: 44px; font-weight: 700; color: var(--gold);
    font-variant-numeric: tabular-nums;
  }
  .timer-label { color: var(--text-dim); font-size: 13px; letter-spacing: 1px; text-transform: uppercase; }
  .timer-actions { display: flex; gap: 12px; }
  .timer-actions button {
    padding: 12px 22px;
    border-radius: 24px;
    border: 1px solid var(--border);
    background: var(--bg-elev);
    color: var(--text);
    font-size: 14px;
    font-weight: 600;
  }
  .timer-actions button.primary {
    background: var(--gold); border-color: var(--gold); color: #13151A;
  }

  ::-webkit-scrollbar { display: none; }
</style>
</head>
<body>

<header class="app-header">
  <h1 id="header-title">Gym Tracker</h1>
  <div class="subtitle" id="header-subtitle">Bloque 5</div>
</header>

<div class="section-switch">
  <button class="section-btn active" data-section="gym"><span class="icon">🏋️</span>Gym</button>
  <button class="section-btn" data-section="food"><span class="icon">🍽️</span>Comida</button>
</div>

<!-- ================= VISTA: RUTINA DEL DÍA ================= -->
<section class="view active" id="view-day" data-section="gym">
  <div class="day-chips" id="day-chips"></div>

  <div class="progress-wrap">
    <div class="progress-label">
      <span id="progress-text">0 / 0 series</span>
      <span id="progress-pct">0%</span>
    </div>
    <div class="progress-track"><div class="progress-fill" id="progress-fill" style="width:0%"></div></div>
  </div>

  <div id="exercise-list"></div>

  <button class="save-day-btn" id="save-day-btn">Guardar día</button>
</section>

<!-- ================= VISTA: SEMANA ================= -->
<section class="view" id="view-week" data-section="gym">
  <div id="week-list"></div>
</section>

<!-- ================= VISTA: ALIMENTACIÓN — HOY ================= -->
<section class="view" id="view-food-today" data-section="food">
  <div class="meal-form card">
    <h2 id="food-today-heading">Hoy</h2>
    <div class="day-chips" id="meal-type-chips"></div>
    <textarea id="meal-desc-input" class="meal-desc-input" rows="2" placeholder="¿Qué comiste?"></textarea>
    <button class="save-day-btn" id="add-meal-btn">Agregar</button>
  </div>
  <div id="food-today-list"></div>
</section>

<!-- ================= VISTA: ALIMENTACIÓN — HISTORIAL ================= -->
<section class="view" id="view-food-history" data-section="food">
  <div class="card">
    <h2>Descargar alimentación</h2>
    <div class="date-range-grid">
      <div class="form-field">
        <label for="food-range-from">Desde</label>
        <input type="date" id="food-range-from">
      </div>
      <div class="form-field">
        <label for="food-range-to">Hasta</label>
        <input type="date" id="food-range-to">
      </div>
    </div>
    <button class="download-btn-inline" id="download-food-btn"><span class="icon">⬇️</span>Descargar CSV</button>
  </div>
  <div id="food-history-list"></div>
</section>

<!-- ================= REST TIMER OVERLAY ================= -->
<div class="timer-overlay" id="timer-overlay">
  <div class="ex-name" id="timer-ex-name"></div>
  <div class="timer-ring-wrap">
    <svg viewBox="0 0 220 220">
      <circle cx="110" cy="110" r="98" stroke="#2A2D36" stroke-width="10" fill="none"></circle>
      <circle cx="110" cy="110" r="98" stroke="#C9A227" stroke-width="10" fill="none"
        stroke-linecap="round" id="timer-ring" stroke-dasharray="615.75" stroke-dashoffset="0"></circle>
    </svg>
    <div class="time-text" id="timer-time">00:00</div>
  </div>
  <div class="timer-label">Descanso</div>
  <div class="timer-actions">
    <button id="timer-skip">Saltar</button>
    <button class="primary" id="timer-add">+15s</button>
  </div>
</div>

<nav class="tabbar" data-section="gym">
  <button class="tab-btn active" data-view="view-day"><span class="icon">🏋️</span>Rutina</button>
  <button class="tab-btn" data-view="view-week"><span class="icon">📅</span>Semana</button>
  <button class="download-btn" id="download-progress-btn"><span class="icon">⬇️</span>Descargar progreso</button>
</nav>

<nav class="tabbar" data-section="food" style="display:none;">
  <button class="tab-btn" data-view="view-food-today"><span class="icon">🍽️</span>Hoy</button>
  <button class="tab-btn" data-view="view-food-history"><span class="icon">📋</span>Historial</button>
</nav>

<script>
/* ======================================================================
   ZONA DE RUTINA — EDITAR AQUÍ
   Para cambiar de bloque de rutina, reemplaza por completo el objeto
   ROUTINE de abajo (respetando la misma forma) y no toques nada más
   en el archivo.

   Forma de cada ejercicio:
   { nombre, sets: <num. de series>, repsLabel: <texto a mostrar, ej "6-8" o "10/pierna">,
     restSec: <segundos de descanso entre series>, nota: <texto técnico> }
   ====================================================================== */
const ROUTINE = {
  order: ['lunes', 'martes', 'miercoles', 'jueves', 'viernes'],
  dias: {
    lunes: {
      nombre: 'Fuerza Lower Body',
      ejercicios: [
        { nombre: 'Peso muerto rumano a una pierna con kettlebell', sets: 4, repsLabel: '8/pierna', restSec: 120, nota: 'Rodilla de apoyo semi-flexionada, torso casi paralelo al piso.' },
        { nombre: 'Prensa de piernas', sets: 4, repsLabel: '10', restSec: 120, nota: 'Pies altos en la plataforma, énfasis en glúteo/isquios.' },
        { nombre: 'Step-up con mancuernas', sets: 4, repsLabel: '10/pierna', restSec: 90, nota: 'Banco a la altura de la rodilla, empuja con el talón, no con el pie de apoyo trasero.' },
        { nombre: 'Hip thrust a una pierna', sets: 3, repsLabel: '10/pierna', restSec: 90, nota: 'Progresión desde el bilateral de Bloque 4.' },
        { nombre: 'Curl femoral tumbado (máquina)', sets: 3, repsLabel: '12', restSec: 75, nota: 'Squeeze arriba.' },
        { nombre: 'Extensión de cuádriceps bilateral', sets: 3, repsLabel: '15', restSec: 60, nota: 'Controlado, sin rebote.' },
      ],
    },
    martes: {
      nombre: 'Fuerza Upper Body',
      ejercicios: [
        { nombre: 'Press inclinado con mancuernas', sets: 5, repsLabel: '5-6', restSec: 150, nota: 'Ángulo 30°, control en bajada.' },
        { nombre: 'Remo con barra agarre prono', sets: 5, repsLabel: '5-6', restSec: 150, nota: 'Torso a 45°, tira hacia el ombligo.' },
        { nombre: 'Press Arnold con mancuernas', sets: 4, repsLabel: '8', restSec: 120, nota: 'Rotación completa, controla el descenso.' },
        { nombre: 'Jalón al pecho agarre supino', sets: 4, repsLabel: '8-10', restSec: 90, nota: 'Cambia énfasis de bíceps vs. el agarre neutro de Bloque 4.' },
        { nombre: 'Face pull con banda', sets: 3, repsLabel: '15', restSec: 60, nota: 'Codos altos.' },
        { nombre: 'Curl martillo con mancuernas', sets: 3, repsLabel: '12', restSec: 60, nota: 'Pieza de brazo repartida del día.' },
      ],
    },
    miercoles: {
      nombre: 'Hipertrofia Upper Body',
      ejercicios: [
        { nombre: 'Press en máquina convergente', sets: 4, repsLabel: '12-15', restSec: 75, nota: '' },
        { nombre: 'Remo en máquina agarre neutro', sets: 4, repsLabel: '12-15', restSec: 75, nota: '' },
        { nombre: 'Elevaciones laterales con mancuerna', sets: 4, repsLabel: '15', restSec: 60, nota: '' },
        { nombre: 'Curl con barra Z', sets: 4, repsLabel: '10-12', restSec: 75, nota: '' },
        { nombre: 'Extensión de tríceps en polea, barra recta', sets: 4, repsLabel: '10-12', restSec: 75, nota: '' },
        { nombre: 'Extensión de tríceps unilateral con mancuerna sobre banco', sets: 3, repsLabel: '12/brazo', restSec: 60, nota: '' },
      ],
    },
    jueves: {
      nombre: 'Brazo (énfasis fuerte) + Core',
      ejercicios: [
        { nombre: 'Curl con mancuernas alternado', sets: 4, repsLabel: '10/brazo', restSec: 75, nota: '' },
        { nombre: 'Curl concentrado con mancuerna', sets: 3, repsLabel: '12/brazo', restSec: 60, nota: '' },
        { nombre: 'Press cerrado en banca (close-grip)', sets: 4, repsLabel: '10', restSec: 90, nota: '' },
        { nombre: 'Extensión de tríceps unilateral en polea', sets: 3, repsLabel: '15/brazo', restSec: 60, nota: '' },
        { nombre: 'Rueda abdominal', sets: 4, repsLabel: '10-12', restSec: 75, nota: 'Rango máximo sin perder lumbar.' },
        { nombre: 'Pallof press en polea', sets: 3, repsLabel: '12/lado', restSec: 60, nota: 'Antirotación, 1 seg extendido.' },
      ],
    },
    viernes: {
      nombre: 'Metabólico Full Body',
      ejercicios: [
        { nombre: 'Press de pecho en máquina', sets: 3, repsLabel: '15', restSec: 45, nota: '' },
        { nombre: 'Remo en polea baja sentado', sets: 3, repsLabel: '15', restSec: 45, nota: '' },
        { nombre: 'Step-up con mancuernas (ligero)', sets: 3, repsLabel: '12/pierna', restSec: 45, nota: '' },

};
const DAY_LABELS = {
  lunes: 'Lunes', martes: 'Martes', miercoles: 'Miércoles', jueves: 'Jueves', viernes: 'Viernes',
  // sábado/domingo no tienen día de rutina de gym, pero Alimentación registra los 7 días
  sabado: 'Sábado', domingo: 'Domingo',
};

/* ======================================================================
   ESTADO Y PERSISTENCIA (localStorage)
   ====================================================================== */
const LS_PROGRESS = 'gym_progress';       // { "YYYY-MM-DD": { dayKey: { "<nombre del ejercicio>": { sets: [{kg,reps,done}] } } } }
const LS_CURRENT_DAY = 'gym_current_day'; // "lunes" | "martes" | ...

function loadJSON(key, fallback) {
  try {
    const raw = localStorage.getItem(key);
    return raw ? JSON.parse(raw) : fallback;
  } catch (e) {
    return fallback;
  }
}
function saveJSON(key, value) {
  localStorage.setItem(key, JSON.stringify(value));
}

let progressData = loadJSON(LS_PROGRESS, {});

/* ======================================================================
   UTILIDADES DE FECHA
   ====================================================================== */
function todayISO() {
  const d = new Date();
  return isoFromDate(d);
}
function isoFromDate(d) {
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, '0');
  const day = String(d.getDate()).padStart(2, '0');
  return `${y}-${m}-${day}`;
}
function ddmmFromISO(iso) {
  const [y, m, d] = iso.split('-');
  return `${d}/${m}`;
}
function weekdayKeyForDate(d) {
  const map = ['domingo', 'lunes', 'martes', 'miercoles', 'jueves', 'viernes', 'sabado'];
  return map[d.getDay()];
}
function mondayOfWeek(d) {
  const date = new Date(d);
  const day = date.getDay(); // 0=domingo
  const diff = day === 0 ? -6 : 1 - day; // desplazamiento hasta el lunes
  date.setDate(date.getDate() + diff);
  return date;
}

/* ======================================================================
   ESTADO DE NAVEGACIÓN
   ====================================================================== */
let currentDay = loadJSON(LS_CURRENT_DAY, null);
if (!currentDay || !ROUTINE.dias[currentDay]) {
  const wd = weekdayKeyForDate(new Date());
  currentDay = ROUTINE.dias[wd] ? wd : 'lunes';
}
function logDateForDay(dayKey) {
  // cada chip de día corresponde a la fecha de esa jornada en la semana actual,
  // no a la fecha de hoy, para poder ver/editar un día ya realizado
  const idx = ROUTINE.order.indexOf(dayKey);
  const monday = mondayOfWeek(new Date());
  const date = new Date(monday);
  date.setDate(monday.getDate() + idx);
  return isoFromDate(date);
}

/* ======================================================================
   ACCESO A PROGRESO DEL DÍA ACTUAL
   ====================================================================== */
function getDayEntry(dateISO, dayKey, create) {
  if (!progressData[dateISO]) {
    if (!create) return null;
    progressData[dateISO] = {};
  }
  if (!progressData[dateISO][dayKey]) {
    if (!create) return null;
    progressData[dateISO][dayKey] = {};
  }
  return progressData[dateISO][dayKey];
}
function getSetState(dateISO, dayKey, exKey, setIndex) {
  const dayEntry = getDayEntry(dateISO, dayKey, false);
  const ex = dayEntry && dayEntry[exKey];
  const set = ex && ex.sets && ex.sets[setIndex];
  return set || { kg: '', reps: '', done: false };
}
function setSetState(dateISO, dayKey, exKey, setIndex, patch) {
  const dayEntry = getDayEntry(dateISO, dayKey, true);
  if (!dayEntry[exKey]) dayEntry[exKey] = { sets: [] };
  if (!dayEntry[exKey].sets[setIndex]) dayEntry[exKey].sets[setIndex] = { kg: '', reps: '', done: false };
  Object.assign(dayEntry[exKey].sets[setIndex], patch);
  saveJSON(LS_PROGRESS, progressData);
}

// Busca la sesión anterior más reciente (en cualquier día) donde este
// ejercicio -identificado por nombre, no por posición- tenga series
// marcadas como completadas. Así sobrevive a cambios de bloque de rutina.
function findLastTime(exName, logDate) {
  const dates = Object.keys(progressData)
    .filter((d) => d !== logDate && d < logDate)
    .sort()
    .reverse();
  for (const d of dates) {
    const dayEntries = progressData[d] || {};
    for (const dk of Object.keys(dayEntries)) {
      const entry = dayEntries[dk][exName];
      if (entry && entry.sets && entry.sets.some((s) => s.done)) {
        const parts = entry.sets
          .filter((s) => s.done)
          .map((s) => (s.kg ? `${s.kg}kg×${s.reps || '?'}` : `${s.reps || '?'}`));
        return { date: d, text: parts.join(' · ') };
      }
    }
  }
  return null;
}

function computeDayProgress(dateISO, dayKey) {
  const dia = ROUTINE.dias[dayKey];
  let total = 0, done = 0;
  dia.ejercicios.forEach((ex) => {
    for (let s = 0; s < ex.sets; s++) {
      total++;
      if (getSetState(dateISO, dayKey, ex.nombre, s).done) done++;
    }
  });
  return { total, done };
}

        <button class="check-btn${state.done ? ' done' : ''}">${state.done ? '✓' : ''}</button>
      `;
      const [kgInput, repsInput] = row.querySelectorAll('input');

        checkBtn.classList.toggle('done', willBeDone);

        }
      });

      setsContainer.appendChild(row);
    }

    exerciseListEl.appendChild(card);
  });

/* ======================================================================
   TEMPORIZADOR DE DESCANSO
   ====================================================================== */
const timerOverlay = document.getElementById('timer-overlay');
const timerRing = document.getElementById('timer-ring');
const timerTimeEl = document.getElementById('timer-time');
const timerExNameEl = document.getElementById('timer-ex-name');
const RING_CIRCUMFERENCE = 2 * Math.PI * 98;
timerRing.setAttribute('stroke-dasharray', RING_CIRCUMFERENCE.toFixed(2));

let timerState = null; // { totalSec, endsAt, rafId }

function startRestTimer(seconds, exName) {
  clearTimerLoop();
  timerExNameEl.textContent = exName;
  timerState = { totalSec: seconds, endsAt: Date.now() + seconds * 1000 };
  timerOverlay.classList.add('show');
  tickTimer();
}

function tickTimer() {
  if (!timerState) return;
  const remainingMs = timerState.endsAt - Date.now();
  const remainingSec = Math.max(0, Math.ceil(remainingMs / 1000));
  const mm = String(Math.floor(remainingSec / 60)).padStart(2, '0');
  const ss = String(remainingSec % 60).padStart(2, '0');
  timerTimeEl.textContent = `${mm}:${ss}`;

  const elapsedFrac = 1 - Math.max(0, remainingMs) / (timerState.totalSec * 1000);
  const offset = RING_CIRCUMFERENCE * Math.min(1, Math.max(0, elapsedFrac));
  timerRing.setAttribute('stroke-dashoffset', offset.toFixed(2));

  if (remainingMs <= 0) {
    finishRestTimer();
    return;
  }
  timerState.rafId = requestAnimationFrame(tickTimer);
}

function finishRestTimer() {
  playBeep();
  if (navigator.vibrate) navigator.vibrate([200, 100, 200, 100, 300]);
  timerTimeEl.textContent = '00:00';
  timerRing.setAttribute('stroke-dashoffset', RING_CIRCUMFERENCE.toFixed(2));
  setTimeout(() => {
    if (timerState) closeTimer();
  }, 1200);
}

function clearTimerLoop() {
  if (timerState && timerState.rafId) cancelAnimationFrame(timerState.rafId);
}

function closeTimer() {
  clearTimerLoop();
  timerState = null;
  timerOverlay.classList.remove('show');
}

document.getElementById('timer-skip').addEventListener('click', closeTimer);
document.getElementById('timer-add').addEventListener('click', () => {
  if (!timerState) return;
  timerState.endsAt += 15000;
  timerState.totalSec += 15;
});

let audioCtx = null;
function playBeep() {
  try {
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    const beepAt = (delay) => {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.value = 880;
      gain.gain.setValueAtTime(0.0001, audioCtx.currentTime + delay);
      gain.gain.exponentialRampToValueAtTime(0.3, audioCtx.currentTime + delay + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + delay + 0.18);
      osc.connect(gain).connect(audioCtx.destination);
      osc.start(audioCtx.currentTime + delay);
      osc.stop(audioCtx.currentTime + delay + 0.2);
    };
    beepAt(0);
    beepAt(0.25);
    beepAt(0.5);
  } catch (e) { /* audio no disponible */ }
}

/* ======================================================================
   DESCARGAR PROGRESO (CSV)
   Exporta todas las series marcadas como completadas, de todo el
   historial guardado en gym_progress, una fila por serie.
   ====================================================================== */
function csvField(value) {
  const str = String(value ?? '');
  return /[",\r\n]/.test(str) ? `"${str.replace(/"/g, '""')}"` : str;
}

function buildProgressCSV() {
  const rows = [['fecha', 'dia', 'ejercicio', 'serie', 'kg', 'reps']];
  Object.keys(progressData).sort().forEach((dateISO) => {
    Object.keys(progressData[dateISO]).forEach((dayKey) => {
      const dayEntry = progressData[dateISO][dayKey];
      const dayLabel = DAY_LABELS[dayKey] || dayKey;
      Object.keys(dayEntry).forEach((exName) => {
        const sets = dayEntry[exName].sets || [];
        sets.forEach((set, i) => {
          if (!set.done) return;
          rows.push([dateISO, dayLabel, exName, i + 1, set.kg || '', set.reps || '']);
        });
      });
    });
  });
  return rows.map((r) => r.map(csvField).join(',')).join('\r\n');
}

document.getElementById('download-progress-btn').addEventListener('click', () => {
  const csv = buildProgressCSV();
  if (csv.split('\r\n').length <= 1) {
    showToast('Aún no hay series completadas');
    return;
  }
  const blob = new Blob(['﻿' + csv], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `gym-progreso-${todayISO()}.csv`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
});

/* ======================================================================
   ZONA DE ALIMENTACIÓN — registro diario de comidas
   Complemento del tracking de gym: mismo patrón de storage (localStorage
   + JSON), mismos componentes visuales (day-chip, card, toast) y mismo
   tipo de export a CSV descargable.
   ====================================================================== */
const MEAL_TYPES = [
  { key: 'desayuno', label: 'Desayuno' },
  { key: 'pre_entreno', label: 'Pre-entreno' },
  { key: 'post_entreno', label: 'Post-entreno' },
  { key: 'comida', label: 'Comida' },
  { key: 'tarde', label: 'Tarde' },
  { key: 'cena', label: 'Cena' },
  { key: 'snack_extra', label: 'Snack / antojo' }, // categoría más importante: antojos fuera de las comidas principales
];
const MEAL_LABELS = Object.fromEntries(MEAL_TYPES.map((m) => [m.key, m.label]));

const LS_FOOD = 'food_entries'; // [{ id, fecha, tipoComida, descripcion, creadoEn }]
let foodEntries = loadJSON(LS_FOOD, []);
let selectedMealType = 'desayuno';
let editingMealId = null;

function saveFoodEntries() {
  saveJSON(LS_FOOD, foodEntries);
}
function addFoodEntry(fecha, tipoComida, descripcion) {
  foodEntries.push({
    id: `${Date.now()}-${Math.random().toString(36).slice(2, 7)}`,
    fecha, tipoComida, descripcion,
    creadoEn: Date.now(),
  });
  saveFoodEntries();
}
function updateFoodEntry(id, patch) {
  const entry = foodEntries.find((e) => e.id === id);
  if (!entry) return;
  Object.assign(entry, patch);
  saveFoodEntries();
}
function deleteFoodEntry(id) {
  foodEntries = foodEntries.filter((e) => e.id !== id);
  saveFoodEntries();
}
function entriesForDate(fecha) {
  return foodEntries.filter((e) => e.fecha === fecha).sort((a, b) => a.creadoEn - b.creadoEn);
}
function entriesInRange(fromISO, toISO) {
  return foodEntries
    .filter((e) => e.fecha >= fromISO && e.fecha <= toISO)
    .sort((a, b) => (a.fecha === b.fecha ? a.creadoEn - b.creadoEn : a.fecha.localeCompare(b.fecha)));
}
function dayLabelForISO(iso) {
  const [y, m, d] = iso.split('-').map(Number);
  return DAY_LABELS[weekdayKeyForDate(new Date(y, m - 1, d))] || '';
}

  const dates = [...new Set(foodEntries.map((e) => e.fecha))].sort().reverse();
  if (!dates.length) {
    listEl.innerHTML = '<div class="meal-empty">Aún no hay comidas registradas.</div>';
    return;
  }
  dates.forEach((fecha) => {
    const entries = entriesForDate(fecha);
    const group = document.createElement('div');
    group.className = 'meal-day-group';
    const title = document.createElement('div');
    title.className = 'meal-day-title';
    title.innerHTML = `${dayLabelForISO(fecha)} ${ddmmFromISO(fecha)} <span class="count">(${entries.length})</span>`;
    group.appendChild(title);
    entries.forEach((e) => renderMealRow(e, group));
    listEl.appendChild(group);
  });
}

/* ---- export CSV por rango de fechas (default: semana en curso, Lun-Dom) ---- */
function buildFoodCSV(fromISO, toISO) {
  const rows = [['fecha', 'dia', 'tipo_comida', 'descripcion']];
  entriesInRange(fromISO, toISO).forEach((e) => {
    rows.push([e.fecha, dayLabelForISO(e.fecha), e.tipoComida, e.descripcion]);
  });
  return rows.map((r) => r.map(csvField).join(',')).join('\r\n');
}

const foodRangeFromEl = document.getElementById('food-range-from');
const foodRangeToEl = document.getElementById('food-range-to');

function setDefaultFoodRange() {
  const monday = mondayOfWeek(new Date());
  const sunday = new Date(monday);
  sunday.setDate(monday.getDate() + 6);
  foodRangeFromEl.value = isoFromDate(monday);
  foodRangeToEl.value = isoFromDate(sunday);
}
setDefaultFoodRange();

document.getElementById('download-food-btn').addEventListener('click', () => {
  const from = foodRangeFromEl.value;
  const to = foodRangeToEl.value;
  if (!from || !to || from > to) {
    showToast('Revisa el rango de fechas');
    return;
  }
  const csv = buildFoodCSV(from, to);
  if (csv.split('\r\n').length <= 1) {
    showToast('No hay comidas en ese rango');
    return;
  }
  const blob = new Blob(['﻿' + csv], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `alimentacion-${from}_a_${to}.csv`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
});

/* ======================================================================
   SELECTOR DE SECCIÓN (Gym / Comida)
   ====================================================================== */
document.querySelectorAll('.section-btn').forEach((btn) => {
  btn.addEventListener('click', () => setSection(btn.dataset.section));
});

function setSection(section) {
  document.querySelectorAll('.section-btn').forEach((b) => b.classList.toggle('active', b.dataset.section === section));
  document.querySelectorAll('nav.tabbar').forEach((n) => {
    n.style.display = n.dataset.section === section ? 'flex' : 'none';
  });
  const nav = document.querySelector(`nav.tabbar[data-section="${section}"]`);
  const firstTab = nav && nav.querySelector('.tab-btn');
  if (firstTab) firstTab.click();
}

/* ======================================================================
   NAVEGACIÓN POR TABS
   ====================================================================== */
document.querySelectorAll('.tab-btn').forEach((btn) => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.tab-btn').forEach((b) => b.classList.remove('active'));
    document.querySelectorAll('.view').forEach((v) => v.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById(btn.dataset.view).classList.add('active');
    if (btn.dataset.view === 'view-week') renderWeekView();
    if (btn.dataset.view === 'view-day') renderDayView();
    if (btn.dataset.view === 'view-food-today') renderFoodTodayView();
    if (btn.dataset.view === 'view-food-history') renderFoodHistoryView();
  });
});

/* ======================================================================
   INIT
   ====================================================================== */
renderDayView();

if ('serviceWorker' in navigator) {
  // En cuanto una versión nueva del service worker toma el control (gracias a
  // skipWaiting + clients.claim en sw.js), recarga una vez para mostrar el
  // HTML/JS nuevo. Sin esto, el navegador instala la actualización en segundo
  // plano pero la página ya abierta se queda mostrando el contenido viejo
  // hasta un segundo reinicio manual de la app.
  let refreshedOnce = false;
  navigator.serviceWorker.addEventListener('controllerchange', () => {
    if (refreshedOnce) return;
    refreshedOnce = true;
    window.location.reload();
  });

  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').then((reg) => {
      // Fuerza una revisión de actualización cada vez que la app vuelve a
      // primer plano (abrir el ícono, volver de segundo plano), en vez de
      // esperar a que el navegador decida revisar por su cuenta.
      document.addEventListener('visibilitychange', () => {
        if (document.visibilityState === 'visible') reg.update().catch(() => {});
      });
    }).catch(() => {});
  });
}
